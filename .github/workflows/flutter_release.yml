# This workflow is custom-modified to build and sign an Android Release (.aab or .apk)
# using the GitHub Secrets (KEYSTORE_BASE64, etc.) set in your repository.

name: Flutter Android Release Build

on:
  push:
    # Workflow hanya akan terpicu ketika ada 'tag' baru (seperti v1.0.0) di-push
    tags:
      - 'v*.*.*'

jobs:
  build:
    # Menggunakan OS Ubuntu terbaru
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Mengatur lingkungan Flutter (Penting!)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Ganti dengan versi Flutter yang Anda gunakan (Contoh: 3.x.x)
          flutter-version: '3.19.6' 
          channel: 'stable' 

      - name: Install dependencies
        run: flutter pub get

      # --- START: Android Signing Configuration ---
      
      # 1. Decode Keystore dari Base64 Secret ke file upload-keystore.jks
      - name: Decode Keystore
        # Menggunakan KEYSTORE_BASE64 secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 2. Buat file key.properties (Mengamankan Kredensial)
      # Ini akan membuat file properti yang digunakan oleh build.gradle
      - name: Create key.properties file
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          
      # 3. Decode google-services.json untuk Firebase (Jika Digunakan)
      - name: Decode Google Services
        # Menggunakan GOOGLE_SERVICES_JSON_BASE64 secret
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
        
      # --- END: Android Signing Configuration ---

      - name: Build Android App Bundle (AAB)
        # Perintah ini akan menggunakan Keystore dan key.properties yang baru dibuat
        run: flutter build appbundle --release
        
      # --- Upload ke GitHub Releases ---
      
      # Langkah ini akan membuat/mengupdate Release di GitHub dengan file .aab
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          body: |
            Automatic release build for ${{ github.ref_name }}.
            
            File AAB ini siap diunggah ke Google Play Console.
